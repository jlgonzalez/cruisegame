<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html,body{background:#060e06;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;font-family:'Press Start 2P',monospace;overflow:hidden;overscroll-behavior:none;touch-action:none;position:fixed;width:100%;height:100%;}
#shell{display:flex;flex-direction:column;border:3px solid #2a6a2a;box-shadow:0 0 50px #00aa0044,0 0 100px #00660022,inset 0 0 8px #00ff0011;max-width:100vw;max-height:100dvh;}
#loading{display:none;color:#66cc33;font-family:'Press Start 2P',monospace;font-size:10px;}
body.loading #loading{display:block;}
body.loading #shell,body.loading #touch-ui{display:none;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
#hud{background:#050e05;border-top:2px solid #1a5a1a;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;color:#66cc33;font-size:7px;letter-spacing:0.5px;gap:12px;flex-wrap:wrap;}
/* ── MOBILE: game fills the whole screen, HUD/controls float as translucent overlays ── */
.touch-mobile #shell{display:block;position:fixed;inset:0;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;border:none;box-shadow:none;}
.touch-mobile canvas{position:absolute;top:0;left:0;}
.touch-mobile #hud{position:absolute;top:0;left:0;right:0;z-index:40;background:rgba(5,14,5,0.45);border-top:none;border-bottom:1px solid rgba(26,90,26,0.45);pointer-events:none;padding:calc(4px + env(safe-area-inset-top)) 12px 4px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
#hud span{white-space:nowrap;}
#cond-wrap{display:flex;align-items:center;gap:5px;}
#cond-swatch{width:9px;height:13px;border:1px solid #336633;display:inline-block;flex-shrink:0;}
#h-peste{display:none;color:#44ff44;animation:blink 0.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}
#tip{font-size:5px;color:#336633;text-align:center;padding:3px;background:#040904;border-top:1px solid #1a3a1a;letter-spacing:0.5px;}
/* ── TOUCH CONTROLS (mobile only) ─────────────────────────────────────── */
#touch-ui{display:none;position:fixed;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:50;}
.touch-mobile #touch-ui{display:block;}
.touch-mobile #tip{display:none;}
/* Split layout: UP+RIGHT stacked on the right, DOWN+LEFT stacked on the left,
   SOLTAR centered underneath both, so each thumb only ever presses one column. */
#pad-left,#pad-right{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;pointer-events:auto;}
#pad-left{left:18px;}
#pad-right{right:18px;}
.dbtn{width:44px;height:44px;background:rgba(40,100,40,0.20);border:2px solid rgba(100,220,100,0.40);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#bfffbf;font-size:14px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.dbtn.active{background:rgba(80,200,80,0.45);border-color:#caffca;}
#actions{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;}
#a-drop{width:64px;height:64px;border-radius:50%;background:rgba(180,60,40,0.26);border:2px solid rgba(255,150,120,0.50);color:#ffe0d0;font-size:8px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
#a-drop.active{background:rgba(220,90,60,0.5);}
#a-start{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;padding:10px 22px;background:rgba(40,120,40,0.4);border:2px solid #8aff8a;color:#eaffea;font-family:'Press Start 2P',monospace;font-size:8px;border-radius:6px;display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.touch-mobile.show-start #a-start{display:block;}
</style>

<body class="loading">
<div id="loading">Cargando…</div>
<div id="shell">
  <canvas id="c"></canvas>
  <div id="hud">
    <span id="h-pts">PTS: 0</span>
    <span id="cond-wrap"><span id="h-cond">CONDON: --</span><span id="cond-swatch"></span></span>
    <span id="h-peste">☠ INFECTADO</span>
    <span id="h-lives">❤️❤️❤️</span>
  </div>
  <div id="tip">WASD/Flechas: mover &nbsp;|&nbsp; X/Espacio: soltar condón &nbsp;|&nbsp; ☠ 30% NPCs tienen la PESTE (invisible)</div>
</div>
<div id="touch-ui">
  <div id="pad-left">
    <div class="dbtn" id="d-down">▼</div>
    <div class="dbtn" id="d-left">◀</div>
  </div>
  <div id="pad-right">
    <div class="dbtn" id="d-up">▲</div>
    <div class="dbtn" id="d-right">▶</div>
  </div>
  <div id="actions"><div id="a-drop">SOLTAR</div></div>
  <div id="a-start">TOCA PARA EMPEZAR</div>
</div>
<script>
'use strict';
// ── CANVAS ────────────────────────────────────────────────────────────────────
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
const SC=2,TILE=16;
let VW=22,VH=15,LW=VW*TILE,LH=VH*TILE;
function setCanvasRes(){
  cv.width=Math.round(LW*SC);cv.height=Math.round(LH*SC);
  cx.setTransform(1,0,0,1,0,0);cx.scale(SC,SC);cx.imageSmoothingEnabled=false;
}
setCanvasRes();

// ── SPRITES ───────────────────────────────────────────────────────────────────
// All art lives in editable PNG sprite sheets under assets/ (see assets/README.md
// for the grid layout of each one) instead of being drawn with canvas shapes.
const CHAR_PAD_TOP=2; // characters are drawn 18px tall (16 + 2px headroom for hair/hats)
const SPRITE_FILES={
  tiles:'assets/tiles.png', player:'assets/player.png', playerNaked:'assets/player_naked.png',
  cop:'assets/cop.png', sado:'assets/sado.png', npcs:'assets/npcs.png', items:'assets/items.png',
};
const SPR={};
let spritesReady=0;
const SPRITE_COUNT=Object.keys(SPRITE_FILES).length;
Object.entries(SPRITE_FILES).forEach(([key,src])=>{
  const img=new Image();
  img.onload=()=>{spritesReady++;};
  img.src=src;
  SPR[key]=img;
});
function spritesLoaded(){return spritesReady>=SPRITE_COUNT;}

// ── MOBILE / RESPONSIVE SETUP ────────────────────────────────────────────────
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('touch-mobile');
// Keep bottom HUD banners (peste/naked countdown) clear of the floating touch d-pad/button.
const UIBOTTOM=IS_TOUCH?90:0;

// Mobile: the canvas fills the entire screen edge-to-edge. Instead of scaling
// a fixed 22x15-tile box down into a small letterboxed area, we recompute how
// many tiles fit the device's real width/height so the game world itself
// occupies 100% of the viewport (HUD and controls float on top, translucent).
function fitScreenMobile(){
  const availW=window.innerWidth;
  const availH=window.visualViewport?window.visualViewport.height:window.innerHeight;
  VW=Math.min(40,Math.max(10,availW/(TILE*SC)));
  VH=Math.min(30,Math.max(8,availH/(TILE*SC)));
  LW=VW*TILE;LH=VH*TILE;
  setCanvasRes();
  cv.style.width=availW+'px';cv.style.height=availH+'px';
}
// Desktop: keep the classic bordered arcade-cabinet look, scaled to fit.
function fitScreenDesktop(){
  const shell=document.getElementById('shell');
  const hud=document.getElementById('hud');
  const tip=document.getElementById('tip');
  const availH=window.innerHeight;
  const availW=window.innerWidth;
  const hudH=hud.offsetHeight+(tip.offsetParent?tip.offsetHeight:0)+6;
  const scaleW=availW/(LW*SC);
  const scaleH=(availH-hudH)/(LH*SC);
  const s=Math.max(0.5,Math.min(scaleW,scaleH,3));
  shell.style.transform=`scale(${s})`;
  shell.style.transformOrigin='center center';
}
function fitScreen(){IS_TOUCH?fitScreenMobile():fitScreenDesktop();}
window.addEventListener('resize',fitScreen);
window.addEventListener('orientationchange',()=>setTimeout(fitScreen,150));
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitScreen);
fitScreen();setTimeout(fitScreen,50);

// Prevent pinch-zoom / double-tap zoom / pull-to-refresh globally
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouchEnd<=300)e.preventDefault();
  lastTouchEnd=now;
},{passive:false});

// ── WORLD ─────────────────────────────────────────────────────────────────────
const WC=64,WR=50,T_GRASS=0,T_TREE=1,T_BUSH=2;
let world=[];
function genWorld(){
  world=Array.from({length:WR},()=>new Uint8Array(WC).fill(T_GRASS));
  for(let x=0;x<WC;x++){world[0][x]=T_TREE;world[WR-1][x]=T_TREE;}
  for(let y=0;y<WR;y++){world[y][0]=T_TREE;world[y][WC-1]=T_TREE;}
  const mx=WC>>1,my=WR>>1;
  for(let y=1;y<WR-1;y++)for(let x=1;x<WC-1;x++)
    if(!(Math.abs(x-mx)<7&&Math.abs(y-my)<7)&&Math.random()<0.24)world[y][x]=T_TREE;
  for(let p=0;p<5;p++){const py=3+Math.floor(Math.random()*(WR-6));for(let x=1;x<WC-1;x++)if(world[py][x]===T_TREE&&Math.random()<0.7)world[py][x]=T_GRASS;}
  for(let p=0;p<5;p++){const px=3+Math.floor(Math.random()*(WC-6));for(let y=1;y<WR-1;y++)if(world[y][px]===T_TREE&&Math.random()<0.7)world[y][px]=T_GRASS;}
  for(let i=0;i<160;i++){const x=1+Math.floor(Math.random()*(WC-2)),y=1+Math.floor(Math.random()*(WR-2));if(world[y][x]===T_GRASS)world[y][x]=T_BUSH;}
}
function walk(tx,ty,nakedMode=false){if(tx<0||tx>=WC||ty<0||ty>=WR)return false;if(nakedMode)return true;const t=world[ty][tx];return t!==T_TREE&&t!==T_BUSH;}

// ── COLORS ────────────────────────────────────────────────────────────────────
const COLS=['red','blue','green','yellow'];
const CM={red:'#ff3333',blue:'#33aaff',green:'#33ff77',yellow:'#ffee22'};
const CD={red:'#881111',blue:'#113388',green:'#116633',yellow:'#887700'};

// ── AUDIO ─────────────────────────────────────────────────────────────────────
let AC=null;
function initAC(){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    // Mobile browsers create/leave the context suspended until explicitly
    // resumed inside a user gesture (and re-suspend it after backgrounding),
    // which is why no sound was audible — resume it on every interaction.
    if(AC.state==='suspended')AC.resume().catch(()=>{});
  }catch(e){}
}
function tone(f,t,d,v,delay=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const s=AC.currentTime+delay;
  g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.0001,s+Math.max(d,0.02));
  o.start(s);o.stop(s+d+0.05);
}
function sfxPickup(){[440,554,659,880].forEach((f,i)=>tone(f,'square',0.1,0.07,i*0.07));}
function sfxMatch(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,'square',0.18,0.1,i*0.1));}
function sfxCaught(){
  if(!AC)return;
  // Police whistle: two sharp high-pitched bursts
  const now=AC.currentTime;
  [[0,0.12],[0.18,0.12]].forEach(([delay,dur])=>{
    const o=AC.createOscillator(),g=AC.createGain(),flt=AC.createBiquadFilter();
    o.type='sine';
    o.frequency.setValueAtTime(2800,now+delay);
    o.frequency.setValueAtTime(3100,now+delay+0.03);
    o.frequency.setValueAtTime(2800,now+delay+0.06);
    flt.type='bandpass';flt.frequency.value=3000;flt.Q.value=8;
    o.connect(flt);flt.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(0.0,now+delay);
    g.gain.linearRampToValueAtTime(0.28,now+delay+0.01);
    g.gain.setValueAtTime(0.28,now+delay+dur-0.02);
    g.gain.linearRampToValueAtTime(0.0,now+delay+dur);
    o.start(now+delay);o.stop(now+delay+dur+0.02);
    // Breath noise layer
    const buf=AC.createBuffer(1,Math.ceil(AC.sampleRate*dur),AC.sampleRate);
    const dat=buf.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=(Math.random()*2-1);
    const ns=AC.createBufferSource(),nf=AC.createBiquadFilter(),ng=AC.createGain();
    nf.type='bandpass';nf.frequency.value=3000;nf.Q.value=3;
    ns.buffer=buf;ns.connect(nf);nf.connect(ng);ng.connect(AC.destination);
    ng.gain.setValueAtTime(0.04,now+delay);ng.gain.linearRampToValueAtTime(0.0,now+delay+dur);
    ns.start(now+delay);ns.stop(now+delay+dur+0.01);
  });
}
function sfxPeste(){
  if(!AC)return;
  [165,147,131,110,98,82].forEach((f,i)=>tone(f,'sawtooth',0.28,0.1,i*0.14));
  const buf=AC.createBuffer(1,AC.sampleRate*0.35,AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;
  const src=AC.createBufferSource(),flt=AC.createBiquadFilter(),gn=AC.createGain();
  flt.type='lowpass';flt.frequency.value=350;src.buffer=buf;
  src.connect(flt);flt.connect(gn);gn.connect(AC.destination);
  gn.gain.setValueAtTime(0.07,AC.currentTime+0.1);gn.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.4);
  src.start(AC.currentTime+0.1);src.stop(AC.currentTime+0.45);
}
function sfxCure(){[262,330,392,523,659,784,1047].forEach((f,i)=>tone(f,'square',0.12,0.09,i*0.065));}

function bgNote(){
  if(!AC||!bgTimer)return;
  const mel=(bgMode==='naked')?NAKED_MEL:BG_MEL;
  const[f,d]=mel[bgStep%mel.length];bgStep++;
  const{pm,tm,ot,hg,bg}=BG_MODES[bgMode];
  if(f>0){
    tone(f*pm,ot,d*tm*0.78,0.055);
    tone(f*pm*0.749,'triangle',d*tm*0.62,hg);
    if(bgStep%3===0)tone(f*pm*0.25,'square',d*tm*0.88,bg);
  }
  bgTimer=setTimeout(bgNote,d*tm*1000);
}
function startBgMusic(mode='normal'){stopBgMusic();bgStep=0;bgMode=mode;bgTimer=setTimeout(bgNote,60);}
function stopBgMusic(){if(bgTimer){clearTimeout(bgTimer);bgTimer=null;}}
function setBgMode(mode){if(bgMode===mode)return;bgMode=mode;bgStep=0;clearTimeout(bgTimer);bgTimer=setTimeout(bgNote,80);}

// ── TOUCH CONTROLS ────────────────────────────────────────────────────────────
function bindHold(el,key){
  if(!el)return;
  const press=ev=>{ev.preventDefault();initAC();if(!K[key])JP.add(key);K[key]=true;el.classList.add('active');};
  const release=ev=>{if(ev)ev.preventDefault();delete K[key];el.classList.remove('active');};
  el.addEventListener('touchstart',press,{passive:false});
  el.addEventListener('touchend',release,{passive:false});
  el.addEventListener('touchcancel',release,{passive:false});
  el.addEventListener('mousedown',press);
  el.addEventListener('mouseup',release);
  el.addEventListener('mouseleave',release);
}
bindHold(document.getElementById('d-up'),'ArrowUp');
bindHold(document.getElementById('d-down'),'ArrowDown');
bindHold(document.getElementById('d-left'),'ArrowLeft');
bindHold(document.getElementById('d-right'),'ArrowRight');
bindHold(document.getElementById('a-drop'),' ');

}

function rfree(minDP=0){
  let x,y,t=0;
  do{x=2+Math.floor(Math.random()*(WC-4));y=2+Math.floor(Math.random()*(WR-4));t++;}
  while((!walk(x,y)||(minDP>0&&pl&&Math.hypot(x-pl.tx,y-pl.ty)<minDP))&&t<2000);
  return{tx:x,ty:y};
}

  if(inv>0&&Math.floor(inv/4)%2===1)return;
  const S=Math.floor(walkFr/7)%2; // 0 or 1 step phase
  const sheet=naked?SPR.playerNaked:SPR.player;
  cx.drawImage(sheet,(dir*2+S)*TILE,0,TILE,18,px,py-CHAR_PAD_TOP,TILE,18);

  if(held&&!naked){
    cx.drawImage(SPR.items,COLS.indexOf(held)*TILE,0,TILE,TILE,px+11,py+4,9,11);
  }
  if(hasPeste){cx.fillStyle='rgba(60,200,60,0.28)';cx.fillRect(px+4,py+1,8,6);}
}

// ── SADO UPDATE ───────────────────────────────────────────────────────────────
function updateSado(){
  if(!sado)return;
  const pcx=pl.x+8,pcy=pl.y+8;
  const distTiles=Math.hypot(sado.tx-pl.tx,sado.ty-pl.ty);
  // Chase logic
  if(!sado.chasing&&distTiles<5)sado.chasing=true;
  if(sado.chasing&&distTiles>10)sado.chasing=false;

  if(sado.wait>0){sado.wait--;sado.moving=false;return;}
  const gx=sado.gtx*TILE,gy=sado.gty*TILE,ddx=gx-sado.x,ddy=gy-sado.y,dist=Math.hypot(ddx,ddy);
  if(dist<sado.sp+0.5){
    sado.x=gx;sado.y=gy;sado.tx=sado.gtx;sado.ty=sado.gty;sado.moving=false;
    sado.wait=sado.chasing?0:18+Math.floor(Math.random()*28);
    if(sado.chasing){
      // Step towards player
      const pdx=pl.tx-sado.tx,pdy=pl.ty-sado.ty;
      let nx=sado.tx,ny=sado.ty;
      if(Math.abs(pdx)>=Math.abs(pdy))nx+=Math.sign(pdx);else ny+=Math.sign(pdy);
      if(walk(nx,ny)){sado.gtx=nx;sado.gty=ny;}
      else{for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]])if(walk(sado.tx+a,sado.ty+b)){sado.gtx=sado.tx+a;sado.gty=sado.ty+b;break;}}
    }else{
      const ds=[[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
      for(const[a,b]of ds)if(walk(sado.tx+a,sado.ty+b)){sado.gtx=sado.tx+a;sado.gty=sado.ty+b;break;}
    }
  }else{
    sado.moving=true;sado.x+=ddx/dist*sado.sp;sado.y+=ddy/dist*sado.sp;
    sado.dir=Math.abs(ddx)>Math.abs(ddy)?(ddx>0?1:3):(ddy>0?2:0);
    sado.stT++;if(sado.stT>9){sado.stT=0;sado.st=(sado.st+1)%2;}
  }
  // Collision with player
  if(pl.inv===0&&Math.hypot(pcx-sado.x-8,pcy-sado.y-8)<11){
    pl.naked=true;pl.nakedTimer=30*60;pl.held=null;pl.sp=2.5;hud();
    sado=null; // desaparece hasta que acaba EN PELOTAS
    setBgMode('naked');
    flash('😱 ¡El SADO te ha desnudado! ¡30s EN PELOTAS! x2 puntos sin condón');
    if(AC){[880,660,440,220].forEach((f,i)=>tone(f,'square',0.09,0.08,i*0.06));}
  }
}
function updatePesteParticles(){
  if(!pl||!pl.hasPeste){pesteParticles=[];return;}
  if(fr%3===0)pesteParticles.push({angle:Math.random()*Math.PI*2,r:10+Math.random()*8,
    spd:0.04+Math.random()*0.04,alpha:0.9,size:1.5+Math.random()*2.5,drift:(Math.random()-0.5)*0.4});
  for(const p of pesteParticles){p.angle+=p.spd;p.r+=0.18;p.alpha-=0.022;}
  pesteParticles=pesteParticles.filter(p=>p.alpha>0);
}
function drawPesteParticles(ox,oy){
  if(!pl.hasPeste||pesteParticles.length===0)return;
  const bx=pl.x+8-ox,by=pl.y+8-oy;
  for(const p of pesteParticles){
    const x=bx+Math.cos(p.angle)*p.r,y=by+Math.sin(p.angle)*p.r+p.drift;
    cx.globalAlpha=p.alpha;
    cx.fillStyle=Math.floor(p.r)%2===0?'#44ff44':'#22cc44';
    cx.fillRect(Math.round(x-p.size/2),Math.round(y-p.size/2),Math.ceil(p.size),Math.ceil(p.size));
  }
  cx.globalAlpha=1;
}

// ── MATCH ANIMATION ───────────────────────────────────────────────────────────
function startMatchAnim(npc){
  sfxMatch();pl.held=null;
  setBgMode('match');
  matchAnim={timer:120,npcColor:npc.color,npc,ox:Math.floor(cam.x),oy:Math.floor(cam.y)};
  gs='matchanim';
}
function updateMatchAnim(){
  if(!matchAnim)return;
  matchAnim.timer--;
  if(matchAnim.timer<=0){
    score++;respawnNPC(matchAnim.npc);spawnCop();hud();
    setBgMode('normal');
    flash('¡PUNTO! +1 🎉  Nuevo policía en el bosque...');
    gs='playing';matchAnim=null;
  }
}

// ── PLAGUE ────────────────────────────────────────────────────────────────────
function activatePeste(n){
  pl.held=null;pl.hasPeste=true;pl.pesteTimer=60*60; // 60 seconds at 60fps
  const idx=npcs.indexOf(n);if(idx>-1)npcs.splice(idx,1);
  spawnNPC(n.color);items=[];spawnPill();
  sfxPeste();setBgMode('peste');
  flash('☠ ¡HAS COGIDO UNA VENEREA!! Busca la PASTILLA');hud();
  pl.venereaMsg=240;
}
function curePeste(){
  pl.hasPeste=false;pl.pesteTimer=0;pill=null;pesteParticles=[];
  COLS.forEach(c=>{spawnCondom(c);spawnCondom(c);});
  setBgMode('normal');sfxCure();
  flash('💊 ¡CURADO! Condones regenerados');hud();
}

// ── UPDATE PLAYER ─────────────────────────────────────────────────────────────
function updatePl(){
  if(pl.inv>0)pl.inv--;
  let dx=0,dy=0;
  if(dn('ArrowLeft')||dn('a')||dn('A')){dx=-1;pl.dir=3;}
  else if(dn('ArrowRight')||dn('d')||dn('D')){dx=1;pl.dir=1;}
  else if(dn('ArrowUp')||dn('w')||dn('W')){dy=-1;pl.dir=0;}
  else if(dn('ArrowDown')||dn('s')||dn('S')){dy=1;pl.dir=2;}
  pl.walking=(dx!==0||dy!==0);
  if(pl.walking){stepTick++;if(stepTick%16===0)sfxStep();}
  if((jp('x')||jp('X')||jp(' '))&&pl.held){
    items.push({tx:pl.tx,ty:pl.ty,color:pl.held,alive:true,bob:0});
    pl.held=null;hud();flash('Condón soltado.');
  }
  if(pl.walking){
    const nx=dx?pl.x+dx*pl.sp:pl.x,ny=dy?pl.y+dy*pl.sp:pl.y,M=3;
    const pts=[[nx+M,ny+M],[nx+TILE-M-1,ny+M],[nx+M,ny+TILE-M-1],[nx+TILE-M-1,ny+TILE-M-1]];
    if(pts.every(([a,b])=>walk(Math.floor(a/TILE),Math.floor(b/TILE),pl.naked))){
      pl.x=Math.max(0,Math.min(nx,(WC-1)*TILE));pl.y=Math.max(0,Math.min(ny,(WR-1)*TILE));
    }
    pl.tx=Math.floor((pl.x+8)/TILE);pl.ty=Math.floor((pl.y+8)/TILE);
  }
  const pcx=pl.x+8,pcy=pl.y+8;
  // Condom pickup (not during plague)
  if(!pl.hasPeste){
    for(const it of items){
      if(!it.alive)continue;
      if(Math.hypot(pcx-it.tx*TILE-8,pcy-it.ty*TILE-8)<11&&!pl.held){
        it.alive=false;pl.held=it.color;hud();sfxPickup();
        flash('¡Recogiste condón '+it.color.toUpperCase()+'!');spawnCondom(it.color);break;
      }
    }
  }
  // Pill pickup
  if(pl.hasPeste&&pill&&Math.hypot(pcx-pill.tx*TILE-8,pcy-pill.ty*TILE-8)<13)curePeste();
  // NPC interaction
  if(!pl.hasPeste){
    for(const n of npcs){
      if(n.cd>0){n.cd--;continue;}
      if(Math.hypot(pcx-n.tx*TILE-8,pcy-n.ty*TILE-8)<12){
        if(pl.naked){
          // Naked power: match any NPC without condom, double points
          if(n.peste){activatePeste(n);}
          else{
            const pts=2;score+=pts;respawnNPC(n);spawnCop();hud();
            sfxMatch();flash('🔥 MATCH EN PELOTAS! +'+pts+' pts! 🎉');
          }
        }else if(pl.held===n.color){
          n.peste?activatePeste(n):startMatchAnim(n);
        }else if(pl.inv===0){
          die(pl.held?'¡Color incorrecto!':'¡Sin condón correcto!');
        }
        break;
      }
    }
  }
  // Police
  if(pl.inv===0)for(const cp of cops)
    if(Math.hypot(pcx-cp.x-8,pcy-cp.y-8)<11){sfxCaught();die('¡Te atrapó la policía!');break;}
  updatePesteParticles();
  // Plague countdown
  if(pl.hasPeste){
    pl.pesteTimer--;
    if(pl.pesteTimer<=0)die('¡La venerea te ha matado! Debías buscar la pastilla.');
  }
  // Naked countdown
  if(pl.naked){
    pl.nakedTimer--;
    if(pl.nakedTimer<=0){
      pl.naked=false;pl.nakedTimer=0;pl.sp=1.7;
      setBgMode(pl.hasPeste?'peste':'normal');
      spawnSado(); // el SADO vuelve a aparecer
      flash('👕 Se acabó el tiempo en pelotas. ¡El SADO ha vuelto!');hud();
    }
  }
}

function die(msg){
  if(pl.hasPeste){
    setBgMode('normal');pl.hasPeste=false;pl.pesteTimer=0;pill=null;pesteParticles=[];
    items=[];COLS.forEach(c=>{spawnCondom(c);spawnCondom(c);});
  }
  if(pl.naked){pl.naked=false;pl.nakedTimer=0;pl.sp=1.7;setBgMode('normal');}
  lives--;pl.held=null;hud();
  if(lives<=0){gs='gameover';stopBgMusic();return;}
  pl.x=(WC>>1)*TILE;pl.y=(WR>>1)*TILE;pl.tx=WC>>1;pl.ty=WR>>1;pl.inv=220;flash('💀 '+msg);
}
function flash(msg){fmsg=msg;ftimer=150;}

// ── UPDATE COPS ───────────────────────────────────────────────────────────────
function updateCops(){
  const distToCop=cp=>Math.hypot(pl.tx-cp.tx,pl.ty-cp.ty);
  for(const cp of cops){
    if(cp.wait>0){cp.wait--;cp.moving=false;continue;}
    // Naked: chase if within 10 tiles. Plague: always aggressive.
    const nakedChase=pl.naked&&distToCop(cp)<10;
    const chaseP=pl.hasPeste?0.88:(nakedChase?0.9:0.5);
    const gx=cp.gtx*TILE,gy=cp.gty*TILE,ddx=gx-cp.x,ddy=gy-cp.y,dist=Math.hypot(ddx,ddy);
    if(dist<cp.sp+0.5){
      cp.x=gx;cp.y=gy;cp.tx=cp.gtx;cp.ty=cp.gty;cp.moving=false;
      cp.wait=pl.hasPeste?5+Math.floor(Math.random()*10):(nakedChase?2+Math.floor(Math.random()*8):15+Math.floor(Math.random()*35));
      if(Math.random()<chaseP){
        const pdx=pl.tx-cp.tx,pdy=pl.ty-cp.ty;
        let nx=cp.tx,ny=cp.ty;
        if(Math.abs(pdx)>=Math.abs(pdy))nx+=Math.sign(pdx);else ny+=Math.sign(pdy);
        if(walk(nx,ny)){cp.gtx=nx;cp.gty=ny;}
        else for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]])if(walk(cp.tx+a,cp.ty+b)){cp.gtx=cp.tx+a;cp.gty=cp.ty+b;break;}
      }else{
        const ds=[[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
        for(const[a,b]of ds)if(walk(cp.tx+a,cp.ty+b)){cp.gtx=cp.tx+a;cp.gty=cp.ty+b;break;}
      }
    }else{
      cp.moving=true;cp.x+=ddx/dist*cp.sp;cp.y+=ddy/dist*cp.sp;
      cp.dir=Math.abs(ddx)>Math.abs(ddy)?(ddx>0?1:3):(ddy>0?2:0);
      cp.stT++;if(cp.stT>7){cp.stT=0;cp.st=(cp.st+1)%2;}
    }
  }
}
function updateCam(){
  const tx=pl.x-(LW/2)+8,ty=pl.y-(LH/2)+8;
  cam.x=Math.max(0,Math.min(tx,(WC-VW)*TILE));cam.y=Math.max(0,Math.min(ty,(WR-VH)*TILE));

// ── MINIMAP ───────────────────────────────────────────────────────────────────
function minimap(ox,oy){
  const mw=56,mh=40,mx=LW-mw-2,my=2,sx=mw/WC,sy=mh/WR;
  cx.fillStyle='rgba(0,0,0,0.78)';cx.fillRect(mx-1,my-1,mw+2,mh+2);
  for(let ty=0;ty<WR;ty++)for(let tx=0;tx<WC;tx++){
    cx.fillStyle=world[ty][tx]===T_TREE?'#183818':'#3a6638';
    cx.fillRect(mx+tx*sx,my+ty*sy,Math.max(sx,0.8),Math.max(sy,0.8));
  }
  for(const it of items){if(!it.alive)continue;cx.fillStyle=CM[it.color];cx.fillRect(mx+it.tx*sx,my+it.ty*sy,1.5,1.5);}
  for(const n of npcs){cx.fillStyle=CM[n.color];cx.fillRect(mx+n.tx*sx-1,my+n.ty*sy-1,2.5,2.5);}
  if(pill){cx.fillStyle=fr%16<8?'#ffaa00':'#ffdd44';cx.fillRect(mx+pill.tx*sx-2,my+pill.ty*sy-2,5,5);}
  if(clothes){cx.fillStyle=fr%16<8?'#aaaaff':'#ffffff';cx.fillRect(mx+clothes.tx*sx-2,my+clothes.ty*sy-2,4,4);}
  if(sado){cx.fillStyle='#cc2200';cx.fillRect(mx+sado.tx*sx-2,my+sado.ty*sy-2,4,4);}
  cx.fillStyle='#4488ff';for(const cp of cops)cx.fillRect(mx+cp.tx*sx-1,my+cp.ty*sy-1,2.5,2.5);
  cx.fillStyle='#ffffff';cx.fillRect(mx+pl.tx*sx-1.5,my+pl.ty*sy-1.5,3,3);
  cx.strokeStyle='rgba(255,255,255,0.35)';cx.lineWidth=0.5;cx.strokeRect(mx+ox/TILE*sx,my+oy/TILE*sy,VW*sx,VH*sy);
  cx.fillStyle='#88aa66';cx.font='4px monospace';cx.textAlign='left';cx.fillText('MAPA',mx,my+mh+6);
}
